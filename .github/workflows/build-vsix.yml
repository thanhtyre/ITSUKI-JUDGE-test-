name: Auto Build VSIX

on:
  push:
    branches:
      - main
      - master # Tự động chạy mỗi khi git push lên nhánh main/master
    tags:
      - 'v*'   # Tự động chạy khi git push tag phiên bản (vd: v1.0.0)
  workflow_dispatch: # Cho phép bấm chạy thủ công nếu muốn

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # Chạy lệnh package có sẵn trong package.json
      - name: Build VSIX Package
        run: npm run package

      # Tự động lưu file .vsix vào mục Artifacts để tải về trực tiếp
      - name: Upload VSIX as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsuki-judge-vsix
          path: '*.vsix'
          retention-days: 14

      # Nếu bạn push kèm Tag (vd: git push origin v1.0.0) thì sẽ tạo luôn GitHub Release
      - name: Publish GitHub Release (khi có Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
