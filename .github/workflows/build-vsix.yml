name: Auto Build VSIX

on:
  workflow_dispatch: # Cho phép bấm nút chạy trực tiếp trên web

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build VSIX Package
        run: npm run package

      - name: Upload VSIX as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsuki-judge-vsix
          path: '*.vsix'
          retention-days: 14
